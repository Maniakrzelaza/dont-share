<style>
/* Layout: redakcyjne biurko — dokument na środku, narzędzia i teczka dowodów obok, pieczątki pod ręką. Świadomie jeden, ciemny „stół”. */
:root {
  --desk: #26302c;
  --desk-2: #1d2522;
  --desk-3: #33403b;
  --desk-fg: #e4eae6;
  --desk-muted: #9aa8a1;
  --paper: #eef0eb;
  --paper-2: #e2e6df;
  --ink: #1b211e;
  --ink-muted: #58635d;
  --rule: #c7cdc6;
  --true: #2059a8;
  --false: #c22f2a;
  --manip: #a8700c;
  --signal: #f2b43a;
  --led: #121815;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 30% -10%, rgba(255,255,255,.05), transparent 60%),
    var(--desk);
  color: var(--desk-fg);
  font: 15px/1.5 var(--font-body);
}
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 24px; }

/* ---------- pasek stanu ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding-block: 10px 14px; border-bottom: 1px solid var(--desk-3); margin-bottom: 18px;
}
.brand {
  font-family: var(--font-display); font-stretch: 70%; font-weight: 850;
  font-size: 20px; letter-spacing: .06em; text-transform: uppercase; margin-right: auto;
}
.brand small { display: block; font: 500 12px/1.2 var(--font-mono); letter-spacing: .02em; text-transform: none; color: var(--desk-muted); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .lbl { font: 500 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--desk-muted); }
.stat .val { font: 600 16px var(--font-mono); font-variant-numeric: tabular-nums; }
.clock {
  background: var(--led); color: var(--signal); border-radius: 4px;
  padding: 4px 10px; font: 600 26px/1.1 var(--font-mono); font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px #000, inset 0 2px 8px rgba(0,0,0,.6);
}
.clock.late { color: #ff7a5c; }
.meter { width: 120px; height: 8px; background: var(--led); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--desk-fg); transition: width .4s; }
.meter.low i { background: var(--false); }
.restart {
  background: transparent; color: var(--desk-muted); border: 1px solid var(--desk-3); border-radius: 4px;
  padding: 6px 10px; font: 500 12px var(--font-mono); align-self: center;
}
.restart:hover { color: var(--desk-fg); border-color: var(--desk-muted); }
.restart.armed { color: var(--signal); border-color: var(--signal); }

/* ---------- biurko ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); } }

.slot-label {
  font: 500 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
  color: var(--desk-muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px;
}

.doc {
  position: relative; background: var(--paper); color: var(--ink);
  border-radius: 3px; padding: 22px 22px 20px;
  box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 14px 30px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.3);
  transform: rotate(-.4deg); overflow: hidden;
}
.ticket {
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  font: 500 11.5px var(--font-mono); color: var(--ink-muted);
  border-bottom: 1px dashed var(--rule); padding-bottom: 10px; margin-bottom: 16px;
}

/* artykuł */
.browser {
  display: flex; align-items: center; gap: 8px; background: var(--paper-2);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; margin-bottom: 14px;
}
.browser .lock { width: 10px; height: 12px; border: 2px solid var(--ink-muted); border-radius: 2px; flex: none; }
.browser .url { font: 500 13px var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
.mast {
  font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 13px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted);
  border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px;
}
.doc h2 {
  font-family: var(--font-display); font-stretch: 82%; font-weight: 800;
  font-size: clamp(22px, 3.2vw, 30px); line-height: 1.08; margin: 0 0 10px; text-wrap: balance;
}
.byline { font: 500 12.5px var(--font-mono); color: var(--ink-muted); margin: 0 0 14px; }
.lead { margin: 14px 0 0; max-width: 62ch; }

/* post */
.post-head { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font: 700 15px var(--font-display); color: #fff;
}
.post-name { font-weight: 600; line-height: 1.2; }
.post-meta { font: 500 12.5px var(--font-mono); color: var(--ink-muted); overflow-wrap: anywhere; }
.post-text { font-size: 17px; line-height: 1.45; margin: 0 0 12px; max-width: 60ch; }
.linkcard { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #fff8; }
.linkcard .o { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-muted); }
.linkcard .t { font-family: var(--font-display); font-stretch: 85%; font-weight: 750; font-size: 18px; line-height: 1.15; margin: 3px 0; }
.linkcard .u { font: 12px var(--font-mono); color: var(--ink-muted); overflow-wrap: anywhere; }
.post-foot { font: 500 13px var(--font-mono); color: var(--ink-muted); display: flex; gap: 18px; flex-wrap: wrap; }

.photo {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 4px; overflow: hidden;
  display: flex; align-items: flex-end; margin: 4px 0 12px;
}
.photo::after {
  content: ""; position: absolute; inset: 0; opacity: .35; mix-blend-mode: overlay;
  background: repeating-radial-gradient(circle at 30% 40%, #fff 0 1px, transparent 1px 3px);
}
.photo span {
  position: relative; z-index: 1; margin: 10px; padding: 4px 8px; border-radius: 3px;
  background: rgba(0,0,0,.6); color: #fff; font: 500 12px var(--font-mono);
}

/* odcisk pieczątki */
.mark {
  position: absolute; left: 50%; top: 42%; z-index: 3; pointer-events: none;
  transform: translate(-50%, -50%) rotate(-14deg);
  font-family: var(--font-display); font-stretch: 72%; font-weight: 900; text-transform: uppercase;
  font-size: clamp(34px, 7vw, 58px); letter-spacing: .06em; line-height: 1;
  padding: 10px 22px; border: 6px double currentColor; border-radius: 8px;
  opacity: .82; mix-blend-mode: multiply; animation: thump .28s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes thump { from { transform: translate(-50%, -50%) rotate(-14deg) scale(1.6); opacity: 0; } }

/* pieczątki */
.stamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.stamp {
  background: var(--paper); border: 3px solid currentColor; border-radius: 6px; padding: 12px 6px 10px;
  font-family: var(--font-display); font-stretch: 72%; font-weight: 900; font-size: 21px;
  text-transform: uppercase; letter-spacing: .06em; line-height: 1;
  box-shadow: 0 5px 0 var(--desk-2), 0 8px 16px rgba(0,0,0,.3);
  transition: transform .08s, box-shadow .08s;
}
.stamp small { display: block; margin-top: 6px; font: 500 10.5px var(--font-mono); letter-spacing: .02em; text-transform: none; color: var(--ink-muted); }
.stamp:hover { transform: translateY(-2px); }
.stamp:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--desk-2), 0 2px 6px rgba(0,0,0,.3); }
.stamp:disabled { opacity: .5; cursor: default; transform: none; }
.s-prawda { color: var(--true); }
.s-falsz { color: var(--false); }
.s-manipulacja { color: var(--manip); }
@media (max-width: 860px) {
  .stamps { position: sticky; bottom: 0; z-index: 5; background: var(--desk); margin-inline: -16px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 16px; border-top: 1px solid var(--desk-3); }
  .stamp { font-size: 18px; }
}

/* narzędzia */
.tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tool {
  text-align: left; background: var(--desk-3); color: var(--desk-fg);
  border: 1px solid #44544d; border-radius: 6px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tool b { font-weight: 600; font-size: 14.5px; }
.tool span { font-size: 12.5px; color: var(--desk-muted); line-height: 1.35; }
.tool em { font: normal 500 11.5px var(--font-mono); color: var(--signal); margin-top: 4px; }
.tool:hover:not(:disabled) { border-color: var(--signal); }
.tool:disabled { cursor: default; opacity: .45; }
.tool.done { opacity: 1; border-style: dashed; background: transparent; }
.tool.done em { color: var(--desk-muted); }

.folder { margin-top: 22px; }
.slips { display: flex; flex-direction: column; gap: 10px; }
.slip {
  background: var(--paper-2); color: var(--ink); border-radius: 2px; padding: 10px 12px 10px 14px;
  font: 13px/1.5 var(--font-mono); border-left: 5px solid var(--ink-muted);
  box-shadow: 0 4px 10px rgba(0,0,0,.25); animation: slide .25s ease-out;
}
.slip .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.slip.red { border-left-color: var(--false); }
.slip.red .h i { color: var(--false); }
.slip.ok { border-left-color: var(--true); }
.slip.ok .h i { color: var(--true); }
.slip .h i { font-style: normal; }
.empty { border: 1px dashed #4a5a53; border-radius: 6px; padding: 14px; color: var(--desk-muted); font-size: 13.5px; }
@keyframes slide { from { transform: translateY(-6px); opacity: 0; } }

/* ekrany pomocnicze */
.memo {
  max-width: 680px; margin: 4vh auto 0; background: var(--paper); color: var(--ink);
  padding: 28px clamp(18px, 4vw, 36px) 30px; border-radius: 3px; box-shadow: 0 18px 40px rgba(0,0,0,.4);
}
.memo .hdr { font: 500 12.5px/1.7 var(--font-mono); color: var(--ink-muted); border-bottom: 1px dashed var(--rule); padding-bottom: 12px; margin-bottom: 18px; }
.memo h1 {
  font-family: var(--font-display); font-stretch: 70%; font-weight: 900; text-transform: uppercase;
  font-size: clamp(36px, 7vw, 56px); line-height: .95; letter-spacing: .01em; margin: 0 0 14px; text-wrap: balance;
}
.memo h2 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 24px; margin: 0 0 10px; text-wrap: balance; }
.memo p { margin: 0 0 12px; max-width: 64ch; }
.verdicts { display: grid; gap: 10px; margin: 16px 0 18px; padding: 0; list-style: none; }
.verdicts li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.verdicts b { font-family: var(--font-display); font-stretch: 72%; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; font-size: 18px; border: 2px solid currentColor; padding: 2px 8px; text-align: center; border-radius: 4px; }
@media (max-width: 520px) { .verdicts li { grid-template-columns: minmax(0, 1fr); gap: 4px; } .verdicts b { justify-self: start; } }
.rules { font-size: 14px; color: var(--ink-muted); padding-left: 18px; margin: 0 0 20px; }
.rules li { margin-bottom: 4px; }
.kbd { font: 600 12px var(--font-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: #fff; }
.go {
  background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 12px 22px;
  font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 17px; letter-spacing: .03em;
}
.go:hover { background: #000; }
.newtool { border: 2px dashed var(--ink); padding: 12px 14px; border-radius: 4px; margin: 14px 0 18px; }
.newtool .t { font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); }
.newtool b { display: block; font-size: 18px; margin: 2px 0; }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0 20px; }
.tally div { border-top: 3px solid var(--ink); padding-top: 6px; }
.tally .n { font: 600 28px var(--font-mono); font-variant-numeric: tabular-nums; }
.tally .l { font-size: 12.5px; color: var(--ink-muted); }
.cheat { padding-left: 20px; margin: 0 0 20px; }
.cheat li { margin-bottom: 6px; max-width: 62ch; }

/* raport po pieczątce */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(10,14,12,.55); padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 861px) { .overlay { align-items: center; } }
.report {
  width: 100%; max-width: 560px; background: var(--paper); color: var(--ink); border-radius: 4px;
  padding: 22px 22px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.5); animation: slide .25s ease-out;
  max-height: 85vh; overflow-y: auto;
}
.report .res { font-family: var(--font-display); font-stretch: 75%; font-weight: 900; font-size: 30px; text-transform: uppercase; line-height: 1; margin: 0 0 6px; }
.report .res.good { color: var(--true); }
.report .res.bad { color: var(--false); }
.report .pts { font: 600 13px var(--font-mono); color: var(--ink-muted); margin-bottom: 14px; }
.report .lesson { border-left: 4px solid var(--ink); padding-left: 12px; margin: 0 0 14px; }
.report .key { font: 13px/1.5 var(--font-mono); color: var(--ink-muted); margin: 0 0 18px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
const TOOLS = {
  zrodlo:   { name: 'Rejestr źródeł',       desc: 'Kto to opublikował i od kiedy działa' },
  data:     { name: 'Archiwum dat',         desc: 'Kiedy treść pojawiła się po raz pierwszy' },
  obraz:    { name: 'Wyszukiwanie obrazem', desc: 'Skąd naprawdę pochodzi zdjęcie' },
  dokument: { name: 'Dokument źródłowy',    desc: 'Pełny cytat, badanie albo raport' }
};
const TOOL_COST = 20;
const DAY_MIN = 480; // 8:00 – 16:00
const VERDICT = { prawda: 'Prawda', falsz: 'Fałsz', manipulacja: 'Manipulacja' };

const DAYS = [
  { date: 'Poniedziałek, 5 października 2026', tools: ['zrodlo', 'data'], speed: 3,
    memo: 'Pierwszy dzień. Masz dwa narzędzia: rejestr źródeł i archiwum dat. Pięć zgłoszeń od czytelników czeka w kolejce.' },
  { date: 'Wtorek, 6 października 2026', tools: ['zrodlo', 'data', 'obraz'], speed: 4, newTool: 'obraz',
    memo: 'Dział IT podłączył wyszukiwarkę obrazów. Dziś dużo zgłoszeń ze zdjęciami. Zegar biegnie szybciej, bo dzień jest gorący.' },
  { date: 'Środa, 7 października 2026', tools: ['zrodlo', 'data', 'obraz', 'dokument'], speed: 5, newTool: 'dokument',
    memo: 'Dostajesz dostęp do bazy dokumentów: zapisów wywiadów, badań i raportów. Ostatni dzień okresu próbnego. Pokaż, co umiesz.' }
];

const CASES = [
  [ // dzień 1
    { kind: 'article', reporter: 'Czytelniczka z Torunia',
      article: { url: 'gazeta-nadwislanska.info/pilne/zakaz-aut', outlet: 'Gazeta Nadwiślańska',
        headline: 'PILNE: Od poniedziałku zakaz wjazdu aut spalinowych do miast powyżej 50 tys. mieszkańców',
        author: 'Redakcja', date: '5.10.2026, 0:14',
        lead: 'Rząd po cichu przyjął rozporządzenie. Mandat wyniesie 5000 zł. Udostępnij, zanim to usuną!' },
      truth: 'falsz', key: 'zrodlo',
      ev: { zrodlo: ['red', 'Domena gazeta-nadwislanska.info zarejestrowana 9 dni temu, właściciel ukryty. Prawdziwa Gazeta Nadwiślańska działa pod adresem gazetanadwislanska.pl od 1998 r. i nie opublikowała tego tekstu.'],
            data: ['info', 'Pierwsze wystąpienie: 4.10.2026, 23:58. Żaden dziennik urzędowy nie zawiera takiego rozporządzenia.'] },
      lesson: 'Podrobiona domena. Czytaj adres litera po literze, bo fałszywe serwisy podszywają się pod znane tytuły. Apel „udostępnij, zanim usuną” to typowy wabik.' },

    { kind: 'article', reporter: 'Kierowca z Sieradza',
      article: { url: 'gazetanadwislanska.pl/region/most-lipowa-remont', outlet: 'Gazeta Nadwiślańska',
        headline: 'Most na Lipowej w Sieradzu zamknięty od 14 października',
        author: 'Anna Wróbel', date: '5.10.2026, 7:40',
        lead: 'Zarząd Dróg Miejskich zapowiada trzytygodniowy remont. Objazd poprowadzi ulicami Kościuszki i Polną, a autobusy linii 3 i 7 zmienią trasy.' },
      truth: 'prawda', key: 'zrodlo',
      ev: { zrodlo: ['ok', 'Serwis działa od 1998 r., w stopce redaktor naczelny i adres redakcji. Autorka podpisuje teksty od 6 lat.'],
            data: ['ok', 'Opublikowano dziś, 7:40. Ten sam komunikat jest na stronie Zarządu Dróg Miejskich z datą 2.10.2026.'] },
      lesson: 'Znane źródło, podpisana autorka, a informację potwierdza komunikat instytucji. Konkretne, nudne wiadomości zwykle są prawdziwe.' },

    { kind: 'post', reporter: 'Zaniepokojony tata',
      post: { name: 'Zdrowie Bez Tajemnic', handle: '@zdrowie.bez.tajemnic', time: '3 godz.',
        text: 'Sok z cytryny z sodą oczyszczoną leczy grypę w 24 godziny! Koncerny farmaceutyczne nie chcą, żebyś to wiedział. Lekarze milczą!!!',
        shares: '42 tys.' },
      truth: 'falsz', key: 'zrodlo',
      ev: { zrodlo: ['red', 'Strona bez autora i danych kontaktowych. Link w opisie profilu prowadzi do sklepu z suplementami.'],
            data: ['info', 'Ten sam tekst krąży w sieci od 2017 r. w kilku językach, za każdym razem jako „nowe odkrycie”.'] },
      lesson: 'Cudowne lekarstwo, wspólny wróg (koncerny, lekarze) i sklep w tle. Gdy ktoś zarabia na tym, w co uwierzysz, sprawdzaj podwójnie.' },

    { kind: 'post', reporter: 'Studentka z Lublina',
      post: { name: 'Info Na Już', handle: '@InfoNaJuz', time: '25 min',
        text: 'Dzieje się TERAZ! Centrum Zamościa pod wodą. Gdzie są służby?!',
        shares: '9,1 tys.',
        link: { outlet: 'Radio Wschód', title: 'Ulewa zalała centrum Zamościa. Woda na Rynku Wielkim po kolana', url: 'radiowschod.pl/wiadomosci/ulewa-zamosc' } },
      truth: 'manipulacja', key: 'data',

let S;

const $app = document.getElementById('app');
const $layer = document.getElementById('layer');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clockText = m => { const t = 480 + Math.min(DAY_MIN, Math.floor(m)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const hueOf = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const curCase = () => CASES[S.day][S.idx];

function render() {
  $layer.innerHTML = '';
  if (S.screen === 'intro') return renderIntro();
  if (S.screen === 'dayIntro') return renderDayIntro();
  if (S.screen === 'dayEnd') return renderDayEnd();
  if (S.screen === 'end') return renderEnd();
  renderDesk();
  if (S.screen === 'feedback') renderFeedback();
}

function renderDayIntro() {
  const d = DAYS[S.day];
  const nt = d.newTool ? `<div class="newtool"><span class="t">Nowe narzędzie</span><b>${TOOLS[d.newTool].name}</b>${TOOLS[d.newTool].desc}.</div>` : '';
  $app.innerHTML = `
  <div class="memo">
    <div class="hdr">DZIEŃ ${S.day + 1} Z 3 · ${d.date}<br>Zgłoszeń w kolejce: ${CASES[S.day].length} · Zaufanie czytelników: ${S.trust}%</div>
    <h2>${S.day === 0 ? 'Witaj w redakcji.' : 'Dzień dobry. Kawa stoi na biurku.'}</h2>
    <p>${d.memo}</p>
    ${nt}
    <button class="go" id="go">Otwórz kolejkę</button>
  </div>`;
  document.getElementById('go').onclick = () => { S.screen = 'desk'; S.idx = 0; S.minutes = 0; S.used = []; render(); };
}

function docHTML(c) {
  const photo = c.photo ? `<div class="photo" style="background:
      radial-gradient(120% 90% at 70% 20%, hsl(${c.photo.hue} 45% 62%), transparent 60%),
      linear-gradient(160deg, hsl(${c.photo.hue} 30% 40%), hsl(${(c.photo.hue + 40) % 360} 25% 18%))"><span>FOT.: ${esc(c.photo.desc)}</span></div>` : '';
  if (c.kind === 'article') {
    const a = c.article;
    return `<div class="browser"><span class="lock"></span><span class="url">https://${esc(a.url)}</span></div>
      <div class="mast">${esc(a.outlet)}</div>
      <h2>${esc(a.headline)}</h2>
      <p class="byline">${esc(a.author)} · ${esc(a.date)}</p>
      ${photo}
      <p class="lead">${esc(a.lead)}</p>`;
  }
  const p = c.post;
  const link = p.link ? `<div class="linkcard"><div class="o">${esc(p.link.outlet)}</div><div class="t">${esc(p.link.title)}</div><div class="u">${esc(p.link.url)}</div></div>` : '';
  return `<div class="post-head"><div class="avatar" style="background:hsl(${hueOf(p.handle)} 40% 38%)">${initials(p.name)}</div>
      <div><div class="post-name">${esc(p.name)}</div><div class="post-meta">${esc(p.handle)} · ${esc(p.time)}</div></div></div>
    <p class="post-text">${esc(p.text)}</p>
    ${link}${photo}
    <div class="post-foot"><span>↻ ${esc(p.shares)} udostępnień</span><span>Zgłoszono jako podejrzane</span></div>`;
}

function renderDesk() {
  const d = DAYS[S.day], c = curCase(), queue = CASES[S.day].length;
  const late = S.minutes > DAY_MIN - 60;
  const toolBtns = Object.keys(TOOLS).map(k => {
    const avail = d.tools.includes(k), done = S.used.includes(k);
    const tag = !avail ? `od dnia ${DAYS.findIndex(x => x.tools.includes(k)) + 1}` : done ? 'sprawdzone' : `−${TOOL_COST} min`;
    return `<button class="tool${done ? ' done' : ''}" data-tool="${k}" ${!avail || done || S.screen !== 'desk' ? 'disabled' : ''}>
      <b>${TOOLS[k].name}</b><span>${TOOLS[k].desc}</span><em>${tag}</em></button>`;
  }).join('');
  const slips = S.used.length ? S.used.map(k => {
    const [flag, txt] = c.ev[k] || ['info', 'Brak dodatkowych informacji.'];
    const label = flag === 'red' ? 'sygnał ostrzegawczy' : flag === 'ok' ? 'potwierdza' : 'kontekst';
    return `<div class="slip ${flag}"><div class="h"><span>${TOOLS[k].name}</span><i>${label}</i></div>${esc(txt)}</div>`;
  }).join('') : `<div class="empty">Teczka jest pusta. Użyj narzędzi, żeby zebrać dowody, zanim przybijesz pieczątkę.</div>`;
  const mark = S.screen === 'feedback' && S.last ? `<div class="mark s-${S.last.verdict}">${VERDICT[S.last.verdict]}</div>` : '';

  $app.innerHTML = `
  <header class="bar">
    <div class="brand">Don’t Share<small>Dzień ${S.day + 1} · ${d.date}</small></div>
    <div class="stat"><span class="lbl">Godzina</span><span class="clock${late ? ' late' : ''}" id="clock">${clockText(S.minutes)}</span></div>
    <div class="stat"><span class="lbl">Kolejka</span><span class="val">${S.idx + 1} / ${queue}</span></div>
    <div class="stat"><span class="lbl">Punkty</span><span class="val">${S.score}</span></div>
    <div class="stat"><span class="lbl">Zaufanie ${S.trust}%</span><div class="meter${S.trust <= 40 ? ' low' : ''}"><i style="width:${S.trust}%"></i></div></div>
    <button class="restart" id="restart">Od nowa</button>
  </header>
  <main class="desk">
    <section>
      <p class="slot-label"><span>Zgłoszenie</span><span>od: ${esc(c.reporter)}</span></p>
      <article class="doc">
        <div class="ticket"><span>NR ${String(S.day + 1)}-${String(S.idx + 1).padStart(3, '0')}</span><span>wpłynęło ${clockText(Math.max(0, S.minutes - 35))}</span></div>
        ${docHTML(c)}
        ${mark}
      </article>
      <div class="stamps">
        ${['prawda', 'falsz', 'manipulacja'].map(v => `<button class="stamp s-${v}" data-v="${v}" ${S.screen !== 'desk' ? 'disabled' : ''}>${VERDICT[v]}<small>klawisz ${v[0].toUpperCase()}</small></button>`).join('')}
      </div>
    </section>
    <aside>
      <p class="slot-label"><span>Narzędzia</span><span>zostało ${Math.max(0, DAY_MIN - Math.floor(S.minutes))} min</span></p>
      <div class="tools">${toolBtns}</div>
      <div class="folder">
        <p class="slot-label"><span>Teczka dowodów</span><span>${S.used.length} ${S.used.length === 1 ? 'dowód' : S.used.length >= 2 && S.used.length <= 4 ? 'dowody' : 'dowodów'}</span></p>
        <div class="slips">${slips}</div>
      </div>
    </aside>
  </main>`;

  $app.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => useTool(b.dataset.tool));
  $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => stamp(b.dataset.v));

  // Dwa kliknięcia zamiast confirm(): przypadkowe kliknięcie nie kasuje całego dnia pracy.
  const $restart = document.getElementById('restart');
  $restart.onclick = () => {
    if ($restart.classList.contains('armed')) { S = fresh(); return render(); }
    $restart.classList.add('armed');
    $restart.textContent = 'Na pewno?';
    setTimeout(() => { $restart.classList.remove('armed'); $restart.textContent = 'Od nowa'; }, 3000);
  };
}

function useTool(k) {
  if (S.screen !== 'desk' || S.used.includes(k) || !DAYS[S.day].tools.includes(k)) return;
  S.used.push(k);
  S.minutes += TOOL_COST;
  if (S.minutes >= DAY_MIN) return endDay();
  render();
}

function stamp(v) {
  if (S.screen !== 'desk') return;
  const c = curCase();
  const correct = v === c.truth;
  const evidence = S.used.some(k => (c.ev[k] || [])[0] !== 'info');
  let pts = 0, dTrust = 0;
  if (correct) { pts = evidence ? 100 : 40; dTrust = 5; } else { dTrust = -20; }
  S.score += pts;
  S.trust = Math.max(0, Math.min(100, S.trust + dTrust));
  S.last = { verdict: v, correct, evidence, pts, dTrust };
  S.log.push({ day: S.day, correct, missed: false });
  S.screen = 'feedback';
  render();
}

function renderFeedback() {
  const c = curCase(), L = S.last;
  const head = L.correct ? (L.evidence ? 'Trafnie.' : 'Trafiony strzał.') : 'Błędny werdykt.';
  const pts = L.correct
    ? `+${L.pts} pkt${L.evidence ? '' : ' (bez dowodu w teczce)'} · zaufanie +${L.dTrust}`
    : `0 pkt · zaufanie ${L.dTrust} · poprawnie: ${VERDICT[c.truth].toUpperCase()}`;
  const lastOne = S.idx + 1 >= CASES[S.day].length;
  $layer.innerHTML = `
  <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="rep-h">
    <div class="report">
      <p class="res ${L.correct ? 'good' : 'bad'}" id="rep-h">${head}</p>
      <div class="pts">${pts}</div>
      <p class="lesson">${esc(c.lesson)}</p>
      <p class="key">Kluczowy dowód: ${TOOLS[c.key].name}${DAYS[S.day].tools.includes(c.key) ? '' : ' (dostępny później)'}.<br>${esc(c.ev[c.key][1])}</p>
      <button class="go" id="next">${S.trust <= 0 ? 'Odbierz wypowiedzenie' : lastOne ? 'Zamknij dzień' : 'Następne zgłoszenie'}</button>
    </div>
  </div>`;
  const btn = document.getElementById('next');
  btn.focus();
  btn.onclick = next;
}

function next() {
  if (S.trust <= 0) { S.screen = 'end'; return render(); }
  S.idx++; S.used = []; S.last = null;
  if (S.idx >= CASES[S.day].length) return endDay();
  S.screen = 'desk';
  render();
}

function endDay() {
  const missed = S.screen === 'desk' ? CASES[S.day].length - S.idx : 0;
  for (let i = 0; i < missed; i++) S.log.push({ day: S.day, correct: false, missed: true });
  S.trust = Math.max(0, S.trust - missed * 10);
  S.last = null;
  S.screen = S.trust <= 0 ? 'end' : 'dayEnd';
  render();
}

function dayStats(day) {
  const l = S.log.filter(x => day === undefined || x.day === day);
  return { ok: l.filter(x => x.correct).length, bad: l.filter(x => !x.correct && !x.missed).length, missed: l.filter(x => x.missed).length };
}

function renderDayEnd() {
  const st = dayStats(S.day);
  const lastDay = S.day + 1 >= DAYS.length;
  $app.innerHTML = `
  <div class="memo">
    <div class="hdr">KONIEC DNIA ${S.day + 1} · ${DAYS[S.day].date}</div>
    <h2>${st.bad + st.missed === 0 ? 'Czysta robota. Ani jedna fałszywka nie przeszła.' : st.ok >= 3 ? 'Niezły dzień, ale kilka rzeczy umknęło.' : 'Ciężki dzień. Jutro sprawdzaj dokładniej.'}</h2>
    <div class="tally">
      <div><div class="n">${st.ok}</div><div class="l">trafne werdykty</div></div>
      <div><div class="n">${st.bad}</div><div class="l">błędne werdykty</div></div>
      <div><div class="n">${st.missed}</div><div class="l">niesprawdzone</div></div>
      <div><div class="n">${S.trust}%</div><div class="l">zaufanie czytelników</div></div>
    </div>
    <button class="go" id="go">${lastDay ? 'Zobacz ocenę okresu próbnego' : 'Idź do domu, wróć jutro'}</button>
  </div>`;
  document.getElementById('go').onclick = () => {
    if (lastDay) S.screen = 'end'; else { S.day++; S.screen = 'dayIntro'; }
    render();
  };
}

function renderEnd() {
  const st = dayStats();
  const total = CASES.flat().length;
  const fired = S.trust <= 0;
  const rank = fired ? 'Zwolnienie dyscyplinarne' : st.ok >= 13 ? 'Starszy weryfikator' : st.ok >= 9 ? 'Weryfikator na etacie' : st.ok >= 5 ? 'Przedłużony okres próbny' : 'Do ponownego szkolenia';
  $app.innerHTML = `
  <div class="memo">
    <div class="hdr">OD: Redaktor naczelna<br>TEMAT: Ocena okresu próbnego</div>
    <h1>${rank}</h1>
    <p>${fired ? 'Czytelnicy przestali nam ufać. Zbyt wiele fałszywek przeszło z naszą pieczątką.' : `Rozpatrzone trafnie: ${st.ok} z ${total} zgłoszeń. Wynik: ${S.score} pkt.`}</p>
    <div class="tally">
      <div><div class="n">${st.ok}</div><div class="l">trafne</div></div>
      <div><div class="n">${st.bad}</div><div class="l">błędne</div></div>
      <div><div class="n">${st.missed}</div><div class="l">niesprawdzone</div></div>
      <div><div class="n">${S.score}</div><div class="l">punkty</div></div>
    </div>
    <h2>Ściąga weryfikatora</h2>
    <ol class="cheat">${CHEAT.map(x => `<li>${x}</li>`).join('')}</ol>
    <button class="go" id="go">Zagraj od nowa</button>
  </div>`;
  document.getElementById('go').onclick = () => { S = fresh(); render(); };
}

// zegar
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (S.screen !== 'desk') return;
  S.minutes += dt * DAYS[S.day].speed;
  if (S.minutes >= DAY_MIN) return endDay();
  const el = document.getElementById('clock');
  if (el) { el.textContent = clockText(S.minutes); el.classList.toggle('late', S.minutes > DAY_MIN - 60); }
}, 250);

document.addEventListener('keydown', e => {
  if (S.screen !== 'desk' || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { p: 'prawda', f: 'falsz', m: 'manipulacja' };
  const v = map[e.key.toLowerCase()];
  if (v) stamp(v);
});

function start(data) {
  S = data && data.S ? data.S : fresh();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
